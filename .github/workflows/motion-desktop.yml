name: Motion desktop candidates
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', 'website/assets/mark.svg', 'website/media-policy.json', '.github/workflows/motion-desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/motion-desktop.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - run: npm run validate
        working-directory: desktop
      - name: Compile Windows helper without changing the runner desktop
        shell: pwsh
        run: ./desktop/native/windows-workerw.ps1 -WindowHandle 0 -X 0 -Y 0 -Width 1 -Height 1 -ValidateOnly
      - run: npm run test:smoke
        working-directory: desktop
      - run: npx electron-builder --win nsis zip --x64 --publish never
        working-directory: desktop
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils openbox ffmpeg libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - run: npm run validate
        working-directory: desktop
      - run: xvfb-run -a sh -c 'openbox >/tmp/motion-openbox.log 2>&1 & npm run test:smoke'
        working-directory: desktop
        env:
          XDG_SESSION_TYPE: x11
          MOTION_TEST_NO_SANDBOX: '1'
      - run: npx electron-builder --linux AppImage deb tar.gz --x64 --publish never
        working-directory: desktop
  publication-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: No public release or installer uploads
        run: node desktop/scripts/publication-check.mjs || echo 'Publication is paused; all jobs produce runner-local candidates only.'
